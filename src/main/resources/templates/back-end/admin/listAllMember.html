<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>會員管理 - listAllMember.html</title>

    <!-- 共用 CSS（bootstrap webjars）-->
    <th:block th:insert="~{back-end/admin/included-fragment}"></th:block>

    <!-- jQuery + DataTables（照教材用 CDN；提供搜尋 / 分頁 / 排序）-->
    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap4.min.css"/>

    <script>
        $(document).ready(function () {
            $('#memberTable').DataTable({
                "lengthMenu": [10, 20, 50, 100],
                "language": {
                    "search": "搜尋:",
                    "lengthMenu": "顯示 _MENU_ 筆",
                    "info": "第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆",
                    "zeroRecords": "沒有符合的資料",
                    "paginate": { "first": "第一頁", "previous": "上一頁", "next": "下一頁", "last": "最後一頁" }
                }
            });
        });
    </script>
</head>
<body>

<nav class="navbar navbar-dark bg-success">
    <a class="navbar-brand" th:href="@{/admin/dashboard}">← 回總覽</a>
    <span class="navbar-text text-white">會員管理 <span th:text="${success}"></span></span>
</nav>

<div class="container-fluid mt-3">
    <table id="memberTable" class="table table-striped table-bordered" style="width:100%">
        <thead class="thead-light">
        <tr>
            <th>計數</th>
            <th>編號</th>
            <th>Email</th>
            <th>姓名</th>
            <th>暱稱</th>
            <th>電話</th>
            <th>縣市</th>
            <th>區</th>
            <th>消費級距</th>
            <th>Email驗證</th>
            <th>狀態</th>
            <th>變更狀態</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="member, stat : ${memberListData}">
            <td th:text="${stat.count}"></td>
            <td th:text="${member.userId}"></td>
            <td th:text="${member.email}"></td>
            <td th:text="${member.userName}"></td>
            <td th:text="${member.userNickname}"></td>
            <td th:text="${member.userPhoneNum}"></td>
            <td th:text="${member.cityName}"></td>
            <td th:text="${member.distName}"></td>
            <td th:text="${member.spendingTier}"></td>
            <td th:text="${member.emailVerified} ? '是' : '否'"></td>
            <td th:text="${member.userStatus}"></td>
            <td>
                <!-- 每列一個小表單；th:action 會自動帶 CSRF 隱藏欄位 -->
                <form method="post"
                      th:action="@{/admin/members/{id}/status(id=${member.userId})}"
                      class="form-inline">
                    <select name="status" class="form-control form-control-sm mr-1">
                        <option value="ACTIVE"    th:selected="${member.userStatus.name() == 'ACTIVE'}">正常</option>
                        <option value="WARNED"    th:selected="${member.userStatus.name() == 'WARNED'}">警告</option>
                        <option value="SUSPENDED" th:selected="${member.userStatus.name() == 'SUSPENDED'}">停權</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-outline-primary">更新</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
