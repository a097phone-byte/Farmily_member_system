# MySQL database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/myproject?serverTimezone=Asia/Taipei&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=123456

#全域設定 Jackson 序列化時間的格式
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

#Hibernate 自動比對 Entity 與現有 schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Google Social Login (走後端授權碼流程 - 取得授權 + OIDC)
#spring.security.oauth2.client.registration.google.client-id=xxx
#spring.security.oauth2.client.registration.google.client-secret=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

# Cookie 端：給 JSESSIONID 加上 Max-Age，關瀏覽器後不會被刪
server.servlet.session.cookie.max-age=1d

# Server 端：session 閒置多久才過期（要 >= cookie max-age 才有意義）
server.servlet.session.timeout=1d

# 處理 cors 跨域同源問題
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
